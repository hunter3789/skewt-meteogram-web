    function data_select(type)
    {
      switch (type)
      {
        case 'double':
          document.getElementById('data-double').classList.add("selected");
          document.getElementById('data-single').classList.remove("selected");
          return [{"variables": variables1, "indices": {}}, {"variables": variables2, "indices": {}}]
          break;
        case 'single':
          document.getElementById('data-single').classList.add("selected");
          document.getElementById('data-double').classList.remove("selected");
          return [{"variables": variables1, "indices": {}}]
          break;
      }
    }

    function skew_ext(node)
    {
      if (node.id.indexOf("reset") == -1) {
        if (node.classList.contains("selected")) {
          node.classList.remove("selected");
        }
        else {
          node.classList.add("selected");
        }
      }

        drawIndices = true;
      }
      else {

      }
